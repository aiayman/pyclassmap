<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="bold">Python Class Map</text>
<text x="40.0" y="50.0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6b6b6b" text-anchor="start">demo - 2026-09-25 - showing: creates (member), creates, holds, calls, inherits - external bases hidden - focused on JsonStore</text>
<rect x="40" y="62" width="520" height="123" rx="4" fill="#f7f7f7" stroke="#bfbfbf" stroke-width="0.8"/>
<text x="52.0" y="78.0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="bold">Legend - relationship kinds</text>
