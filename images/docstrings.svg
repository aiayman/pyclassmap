<text x="192.0" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#404040" text-anchor="start">Foo() on the fly in a method or function body - not stored on self</text>
<line x1="52" y1="119" x2="86" y2="119" stroke="rgb(46,163,79)" stroke-width="1.4" stroke-dasharray="5,3"/>
<polygon points="92.0,119.0 84.5,122.2 84.5,115.8" fill="rgb(46,163,79)" stroke="rgb(46,163,79)" stroke-width="1"/>
<text x="102.0" y="122.0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="rgb(46,163,79)" text-anchor="start" font-weight="bold">holds</text>
<text x="192.0" y="122.0" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#404040" text-anchor="start">typed __init__ param or class field - holds an instance it did not create</text>
<line x1="52" y1="134" x2="86" y2="134" stroke="rgb(48,110,204)" stroke-width="1.4" stroke-dasharray="2,3"/>
