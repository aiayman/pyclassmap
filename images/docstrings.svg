<polygon points="92.0,89.0 84.5,92.2 84.5,85.8" fill="rgb(214,69,64)" stroke="rgb(214,69,64)" stroke-width="1"/>
<text x="102.0" y="92.0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="rgb(214,69,64)" text-anchor="start" font-weight="bold">creates (member)</text>
<text x="192.0" y="92.0" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#404040" text-anchor="start">self.attr = Foo() - the instance is stored on the object (owned for its lifetime)</text>
<line x1="52" y1="104" x2="86" y2="104" stroke="rgb(184,135,20)" stroke-width="1.4"/>
